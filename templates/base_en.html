<!DOCTYPE html>
<html lang='{{ lang }}'>
{% block head %}
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>document.documentElement.classList.add('js');</script>
    <!-- Self-hosted Bootstrap: no integrity/crossorigin. The hashes that used to be here were
         for a different (CDN) build and made the browser block these files outright. -->
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="apple-touch-icon" sizes="180x180"
          href="{{ url_for('static', filename='favicon/apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32"
          href="{{ url_for('static', filename='favicon/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16"
          href="{{ url_for('static', filename='favicon/favicon-16x16.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='favicon/site.webmanifest') }}">
    <link rel="mask-icon" href="{{ url_for('static', filename='favicon/safari-pinned-tab.svg') }}" color="#5bbad5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather&amp;family=Montserrat&amp;family=Sacramento&amp;display=swap" rel="stylesheet">
    <!-- Font Awesome CSS -->
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Solovei Dima Software Developer Personal Site Соловей Діма Персональний сайт">
    <meta name="google-site-verification" content="MP6knESgg8huKzPQW-O0QlR-ycXBR18TNBEV9Q0pVOE" />
    <!-- bundle already contains Popper + all of Bootstrap's JS -->
    <script defer src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script defer src="https://kit.fontawesome.com/5ab6aa530f.js" crossorigin="anonymous"></script>
    <title>Solovei Dima - Personal Site</title>
</head>
{% endblock %}
<body>
{% block content %}
<div id="content" class="sticky-top">
    <header class="site-header">
        <div class="container-xl nav-inner">
            <a class="brand" href="{{ url_for('home', lang=lang) }}">
                <img class="logo hover-effect" src="{{ url_for('static', filename='logo/logo.png') }}"
                     alt="Dima Solovei Logo">
                <span class="brand-name font-sacramento">Dima Solovei</span>
            </a>
            <ul class="lang-switch">
                <li><a href="{{ url_for('switch_lang', lang='uk') }}" class="nav-link uk-lang"
                       aria-label="Українська"><img id="uk-lang"
                                                    src="{{ url_for('static', filename='img/ukraine.png') }}"
                                                    alt="ukrainian_language_image"></a></li>
                <li><a href="{{ url_for('switch_lang', lang='en') }}" class="nav-link is-active en-lang"
                       aria-label="English"><img id="en-lang"
                                                 src="{{ url_for('static', filename='img/english.png') }}"
                                                 alt="english_language_image"></a></li>
            </ul>
            <nav class="nav-scroll" aria-label="Main">
                <ul class="nav-links">
                    <li><a href="{{ url_for('home', lang=lang) }}" class="nav-link font-garamond">Home</a></li>
                    <li><a href="#certificates" class="nav-link font-garamond">Certificates</a></li>
                    <li><a href="#projects" class="nav-link font-garamond">Projects</a></li>
                    <li><a href="#contacts" class="nav-link font-garamond">Contact Me</a></li>
                    <li><a href="{{ url_for('download', name='CV_Dmytro_Solovei.pdf') }}"
                           class="btn btn-secondary nav-cta">Download CV</a></li>
                </ul>
            </nav>
        </div>
    </header>
</div>
{% endblock %}
{% block footer %}
<footer class="site-footer">
    <div class="container-xl footer-inner">
        <p class="footer-copy">© {{ now.year }}, Dima Solovei</p>
        <a href="{{ url_for('home', lang=lang) }}"><img class="footer-logo"
                                                        src="{{ url_for('static', filename='logo/logo.png') }}"
                                                        alt="Dima Solovei Logo"></a>
        <ul class="footer-social">
            <li><a href="mailto:solovei.dmytro@gmail.com" aria-label="Email">
                <i class="fa fa-envelope footer-icons"></i>
            </a></li>
            <li><a href="https://www.linkedin.com/in/dimasolo/" aria-label="LinkedIn">
                <i class="fa-brands fa-linkedin footer-icons"></i>
            </a></li>
            <li><a href="https://www.facebook.com/DimaSolovei1986" aria-label="Facebook">
                <i class="fa-brands fa-square-facebook footer-icons"></i>
            </a></li>
            <li><a href="tg://resolve?domain=dimasolovei1986" aria-label="Telegram">
                <i class="fa fa-telegram footer-icons" aria-hidden="true"></i>
            </a></li>
        </ul>
    </div>
</footer>
{% endblock %}
<script>
    (function () {
        var header = document.getElementById("content");
        var prevScrollpos = window.pageYOffset;

        window.onscroll = function () {
            var currentScrollPos = window.pageYOffset;
            if (prevScrollpos > currentScrollPos || currentScrollPos < 10) {
                header.style.top = "0";
            } else {
                header.style.top = "-100%";
            }
            header.classList.toggle("is-scrolled", currentScrollPos > 8);
            prevScrollpos = currentScrollPos;
        };

        var reveals = [].slice.call(document.querySelectorAll(".reveal"));
        if (!("IntersectionObserver" in window)) {
            reveals.forEach(function (el) { el.classList.add("is-visible"); });
            return;
        }
        var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add("is-visible");
                    observer.unobserve(entry.target);
                }
            });
        }, {rootMargin: "0px 0px -40px 0px", threshold: 0});
        reveals.forEach(function (el) { observer.observe(el); });
    })();
</script>
</body>
</html>
